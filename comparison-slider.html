<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Before After Image Filter</title>

    <script src="https://unpkg.com/lucide@latest"></script>


    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/comparasion.css">
</head>


<body>

    <header class="simple-header">
        <div class="simple-header-inner">

            <a href="index.html" class="logo-link" title="Smooth N Shine">
                <img src="assets/images/logo.svg" alt="Smooth N Shine" class="site-logo-img">
            </a>

            <a href="index.html" class="back-home">
                <i data-lucide="arrow-left"></i>
                Back to Home
            </a>

        </div>
    </header>

    <div class="wrapper">

        <!-- Upload Image -->
        <div class="upload-box">

            <label for="imageUpload" class="upload-label">

                <div class="upload-icon">
                    <i data-lucide="cloud-upload"></i>
                </div>

                <h3>Upload Your Image</h3>

                <p>
                    Click to browse or drag & drop your image here
                </p>

                <span>
                    PNG, JPG or WEBP • Max 5MB
                </span>

                <input type="file" id="imageUpload" accept="image/*">

            </label>

        </div>


        <!-- =========================
             BEFORE / AFTER SLIDER
        ========================== -->

        <div class="comparison-slider" id="comparisonSlider">


            <!-- AFTER
                 Same image + clean filter
            -->

            <div class="comparison-layer after">

                <img src="https://soleabeautylounge.com/wp-content/uploads/2022/11/laser-treatment-on-the-chest.jpg"
                    id="afterImage" alt="Clean After Image">

            </div>


            <!-- BEFORE
                 Same image + original
            -->

            <div class="comparison-layer before">

                <img src="https://soleabeautylounge.com/wp-content/uploads/2022/11/laser-treatment-on-the-chest.jpg"
                    id="beforeImage" alt="Original Before Image">

            </div>


            <!-- Vertical line -->

            <div class="comparison-divider" id="comparisonDivider"></div>


            <!-- Round Handle -->

            <div class="comparison-handle" id="comparisonHandle">

                <div class="arrows">
                    <span>‹</span>
                    <span>›</span>
                </div>

            </div>


            <!-- Labels -->

            <span class="comparison-label before-label">
                Before
            </span>

            <span class="comparison-label after-label">
                After
            </span>


        </div>

    </div>

    <!-- ================= FOOTER ================= -->
    <footer class="simple-footer">

        <div class="simple-footer-inner">

            <p>
                © 2026 Smooth N Shine. All rights reserved.
            </p>

            <a href="treatments.html">
                Back to Treatment →
            </a>

        </div>

    </footer>

    <script src="js/comparasion.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
