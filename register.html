<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Smooth N Shine Aesthetics</title>
    <meta name="description" content="Register with Smooth N Shine for exclusive discounts, rewards, and seamless doorstep aesthetic bookings." />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#A66373', dark: '#7E4150', light: '#FAF2EF' },
                        purple: { DEFAULT: '#A66373', light: '#DFC2C9' },
                        secondary: { DEFAULT: '#C57668', dark: '#A85B4E', light: '#EAA597' },
                        coral: { DEFAULT: '#C57668', light: '#EAA597' },
                        lavender: { DEFAULT: '#DFC2C9', light: '#FAF4F0' },
                        dark: '#2B1A20',
                        text: '#2B1A20',
                        muted: '#78636B',
                        background: '#FAF4F0',
                        border: '#ECDAD5',
                        success: '#238B65',
                        warning: '#C57668'
                    },
                    fontFamily: {
                        serif: ['"DM Serif Display"', 'Georgia', 'serif'],
                        sans: ['"DM Sans"', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-background text-text font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="py-6 px-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center shrink-0" title="Smooth N Shine">
                <img src="assets/images/logo.svg" alt="Smooth N Shine" class="site-logo-img h-11 w-auto object-contain">
            </a>
            <a href="index.html" class="text-xs font-bold text-muted hover:text-primary flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
            </a>
        </div>
    </header>

    <!-- Main Form Card -->
    <main class="flex-1 flex items-center justify-center px-4 py-2">
        <div class="w-full max-w-md bg-white p-8 rounded-3xl border border-border shadow-xl space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-bold font-serif text-dark">Create Account</h1>
                <p class="text-xs text-muted">Join Smooth N Shine to receive ₹500 off your first booking</p>
            </div>

            <form id="registerForm" class="space-y-4" onsubmit="event.preventDefault(); alert('Account created successfully! Welcome to Smooth N Shine.'); window.location.href='dashboard.html';">
                <div>
                    <label class="block text-xs font-bold uppercase text-text mb-1">Full Name</label>
                    <input type="text" required placeholder="Priya Sharma" class="w-full h-11 px-3.5 rounded-xl border border-border bg-background text-xs outline-none focus:border-primary">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-text mb-1">Mobile Number</label>
                    <input type="tel" required placeholder="+91 98765 43210" class="w-full h-11 px-3.5 rounded-xl border border-border bg-background text-xs outline-none focus:border-primary">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-text mb-1">Email Address</label>
                    <input type="email" required placeholder="priya@example.com" class="w-full h-11 px-3.5 rounded-xl border border-border bg-background text-xs outline-none focus:border-primary">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-text mb-1">Create Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full h-11 px-3.5 rounded-xl border border-border bg-background text-xs outline-none focus:border-primary">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-text mb-1">Confirm Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full h-11 px-3.5 rounded-xl border border-border bg-background text-xs outline-none focus:border-primary">
                </div>

                <div class="text-[11px] text-muted leading-tight">
                    By signing up, you agree to our <a href="contact.html" class="text-primary underline">Terms of Service</a> and <a href="contact.html" class="text-primary underline">Privacy Policy</a>.
                </div>

                <button type="submit" class="w-full h-12 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-xs shadow-md transition-all">
                    Create Account
                </button>
            </form>

            <div class="text-center text-xs text-muted">
                <span>Already have an account?</span>
                <a href="login.html" class="text-primary font-bold hover:underline ml-1">Sign In</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-muted border-t border-border">
        © 2026 Smooth N Shine Aesthetics Pvt. Ltd. All rights reserved.
    </footer>

    <!-- ================= MOBILE BOTTOM NAVIGATION ================= -->
    <nav id="mobileBottomNav"
        class="fixed bottom-0 left-0 right-0 z-[9990] h-[68px] bg-white/95 border-t border-border shadow-[0_-5px_25px_rgba(32,18,15,0.08)] backdrop-blur-md md:hidden">

        <div class="relative h-full grid grid-cols-5 items-center px-1">

            <!-- HOME -->
            <a href="index.html"
                class="group h-full flex flex-col items-center justify-center gap-1 text-primary no-underline">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Home</span>
            </a>

            <!-- SERVICES -->
            <a href="treatments.html"
                class="group h-full flex flex-col items-center justify-center gap-1 text-text no-underline">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Services</span>
            </a>

            <!-- BOOKING -->
            <a href="booking.html" id="mobileBookingButton"
                class="group relative h-full flex items-center justify-center no-underline" style="background-color: transparent !important;">

                <div
                    class="absolute -top-[20px] w-14 h-14 rounded-full bg-primary text-white shadow-lg flex items-center justify-center">

                    <i data-lucide="calendar-plus" class="w-6 h-6"></i>

                    <!-- BOOKING NOTIFICATION -->
                    <span id="mobileBookingBadge"
                        class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[11px] font-bold w-6 h-6 rounded-full border-2 border-white flex items-center justify-center shadow-lg badge-pop">
                        0
                    </span>

                </div>
            </a>

            <!-- OFFERS -->
            <a href="offers.html"
                class="group h-full flex flex-col items-center justify-center gap-1 text-text no-underline">
                <i data-lucide="tag" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Offers</span>
            </a>

            <!-- ACCOUNT -->
            <a href="dashboard.html"
                class="group h-full flex flex-col items-center justify-center gap-1 text-text no-underline">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Account</span>
            </a>

        </div>
    </nav>

    <script src="js/script.js"></script>
</body>

</html>
